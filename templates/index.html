<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wine Quality Predictor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <main class="container">

        <!-- Header -->
        <header class="hero">

            <div class="wine-icon">🍷</div>

            <div>
                <p class="small-title">AI POWERED PREDICTION</p>

                <h1>
                    Wine Quality
                    <span>Predictor</span>
                </h1>

                <p class="subtitle">
                    Analyze wine characteristics and predict its quality
                    using Machine Learning.
                </p>
            </div>

        </header>


        <!-- Main Card -->
        <section class="glass-card">

            <div class="card-header">

                <div>
                    <h2>Wine Characteristics</h2>

                    <p>
                        Enter the chemical properties of the wine below.
                    </p>
                </div>

                <div class="model-badge">
                    <span class="status-dot"></span>
                    Random Forest
                </div>

            </div>


            <!-- Prediction Form -->
            <form action="/predict" method="POST">

                <div class="input-grid">

                    <!-- Fixed Acidity -->
                    <div class="input-group">
                        <label>Fixed Acidity</label>
                        <input
                            type="number"
                            step="any"
                            name="fixed_acidity"
                            placeholder="e.g. 7.4"
                            required>
                    </div>


                    <!-- Volatile Acidity -->
                    <div class="input-group">
                        <label>Volatile Acidity</label>
                        <input
                            type="number"
                            step="any"
                            name="volatile_acidity"
                            placeholder="e.g. 0.70"
                            required>
                    </div>


                    <!-- Citric Acid -->
                    <div class="input-group">
                        <label>Citric Acid</label>
                        <input
                            type="number"
                            step="any"
                            name="citric_acid"
                            placeholder="e.g. 0.00"
                            required>
                    </div>


                    <!-- Residual Sugar -->
                    <div class="input-group">
                        <label>Residual Sugar</label>
                        <input
                            type="number"
                            step="any"
                            name="residual_sugar"
                            placeholder="e.g. 1.9"
                            required>
                    </div>


                    <!-- Chlorides -->
                    <div class="input-group">
                        <label>Chlorides</label>
                        <input
                            type="number"
                            step="any"
                            name="chlorides"
                            placeholder="e.g. 0.076"
                            required>
                    </div>


                    <!-- Free Sulfur Dioxide -->
                    <div class="input-group">
                        <label>Free Sulfur Dioxide</label>
                        <input
                            type="number"
                            step="any"
                            name="free_sulfur_dioxide"
                            placeholder="e.g. 11"
                            required>
                    </div>


                    <!-- Total Sulfur Dioxide -->
                    <div class="input-group">
                        <label>Total Sulfur Dioxide</label>
                        <input
                            type="number"
                            step="any"
                            name="total_sulfur_dioxide"
                            placeholder="e.g. 34"
                            required>
                    </div>


                    <!-- Density -->
                    <div class="input-group">
                        <label>Density</label>
                        <input
                            type="number"
                            step="any"
                            name="density"
                            placeholder="e.g. 0.9978"
                            required>
                    </div>


                    <!-- pH -->
                    <div class="input-group">
                        <label>pH</label>
                        <input
                            type="number"
                            step="any"
                            name="ph"
                            placeholder="e.g. 3.51"
                            required>
                    </div>


                    <!-- Sulphates -->
                    <div class="input-group">
                        <label>Sulphates</label>
                        <input
                            type="number"
                            step="any"
                            name="sulphates"
                            placeholder="e.g. 0.56"
                            required>
                    </div>


                    <!-- Alcohol -->
                    <div class="input-group">
                        <label>Alcohol</label>
                        <input
                            type="number"
                            step="any"
                            name="alcohol"
                            placeholder="e.g. 9.4"
                            required>
                    </div>

                </div>


                <!-- Button -->
                <button type="submit" class="predict-button">

                    <span>Predict Wine Quality</span>

                    <span class="arrow">→</span>

                </button>

            </form>

        </section>


        <!-- Footer -->
        <footer>

            <span>Machine Learning</span>

            <span>•</span>

            <span>Random Forest</span>

            <span>•</span>

            <span>Flask</span>

        </footer>

    </main>

</body>

</html>
